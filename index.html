<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MKW 24p 大規模大会ポイントランキング</title><link rel="stylesheet" href="style.css"></head>
<body><header><div class="container head"><div><p class="eyebrow">MKW · Tournament Rankings</p><h1>MKW 24p 大規模大会ポイントランキング</h1><p class="sub">52週ランキングとシーズン別獲得ポイントを閲覧できます</p></div><div class="counts"><div><strong id="players-count">—</strong><span>選手</span></div><div><strong id="events-count">—</strong><span>対象大会</span></div></div></div></header>
<main class="container"><section class="toolbar" aria-label="ランキング表示設定"><label>ランキング<select id="period"><option value="rolling">52週ランキング</option><option value="2025-2026season">2025-2026season</option></select></label><label>大会形式<select id="mode"><option value="all">全形式</option><option>FFA</option><option>2v2</option><option>3v3</option><option>4v4</option><option>6v6</option></select></label><label>プレイヤー名で検索<input id="search" type="search" placeholder="名前を入力" autocomplete="off"></label><label>並び順<select id="sort"><option value="rank">獲得Points順</option><option value="name">名前順</option><option value="participations">参加大会数順</option></select></label><label>表示件数<select id="limit"><option value="100">上位100名</option><option value="500">上位500名</option><option value="all">全選手</option></select></label></section><p class="meta"><span id="updated">—</span><span id="shown">—</span></p><p class="hint" id="period-note">52週経過後、次の大会終了時にポイントが失効します。対象大会の終了日を基準に集計します。</p><div class="table-wrap" role="region" tabindex="0" aria-label="ランキング表"><table><thead id="thead"></thead><tbody id="tbody"><tr><td>データを読み込んでいます…</td></tr></tbody></table></div><p id="status" class="status" role="status"></p><footer>2025-2026seasonは2025年11月～2026年12月。以降は暦年で集計します。シーズンの獲得ポイントは失効しません。公開対象は選手名と大会成績のみです。</footer></main><script src="app.js" defer></script></body></html>
